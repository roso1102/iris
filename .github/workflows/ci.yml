name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r services/ingestion-worker/requirements.txt
          pip install -r services/retrieval_api/requirements.txt

      - name: Run unit tests (unittest + pytest)
        env:
          MODEL_BACKEND: mock
          QDRANT_URL: ""
          RUN_VERTEX_LIVE_TESTS: "0"
        run: |
          python -m unittest discover -s tests
          pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Build + push images
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build ingestion-worker
        run: |
          gcloud builds submit --config=services/ingestion-worker/cloudbuild.yaml \
            --substitutions=_REPO=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris .
      - name: Build retrieval-api
        run: |
          gcloud builds submit --config=services/retrieval_api/cloudbuild.yaml \
            --substitutions=_REPO=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris .

      - name: Deploy ingestion-worker
        run: |
          gcloud run deploy ingestion-worker \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris/ingestion-worker:latest \
            --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} \
            --no-allow-unauthenticated --cpu=2 --memory=4Gi --max-instances=10 \
            --service-account=ingestion-worker-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector=iris-connector --vpc-egress=private-ranges-only
      - name: Deploy retrieval-api
        run: |
          gcloud run deploy retrieval-api \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris/retrieval-api:latest \
            --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} \
            --no-allow-unauthenticated --cpu=2 --memory=2Gi --max-instances=10 \
            --service-account=retrieval-api-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector=iris-connector --vpc-egress=private-ranges-only
