name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r services/ingestion-worker/requirements.txt
          pip install -r services/retrieval_api/requirements.txt

      - name: Run unit tests (unittest + pytest)
        env:
          MODEL_BACKEND: mock
          QDRANT_URL: ""
          RUN_VERTEX_LIVE_TESTS: "0"
          RUN_QDRANT_LIVE_TESTS: "0"
        run: |
          python -m unittest discover -s tests
          pytest tests/ -q

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-rules-test/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install rules-test deps
        working-directory: firestore-rules-test
        run: npm install --include=dev --force

      - name: Run Firestore rules tests (emulator)
        working-directory: firestore-rules-test
        run: npx firebase emulators:exec --only firestore "npm test"

  build:
    runs-on: ubuntu-latest
    needs: [test, firestore-rules]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Build + push images
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build ingestion-worker
        run: |
          gcloud builds submit --config=services/ingestion-worker/cloudbuild.yaml \
            --substitutions=_REPO=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris .
      - name: Build retrieval-api
        run: |
          gcloud builds submit --config=services/retrieval_api/cloudbuild.yaml \
            --substitutions=_REPO=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris .

      - name: Deploy ingestion-worker
        run: |
          gcloud run deploy ingestion-worker \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris/ingestion-worker:latest \
            --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} \
            --no-allow-unauthenticated --ingress=all --cpu=2 --memory=8Gi --max-instances=10 --min-instances=0 --concurrency=1 --timeout=900 \
            --service-account=ingestion-worker-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector=iris-connector --vpc-egress=private-ranges-only \
            --set-env-vars="MODEL_BACKEND=vertex,GCP_PROJECT=${{ vars.GCP_PROJECT_ID }},FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},EMBEDDING_MODEL=text-embedding-004,SYNTHESIS_MODEL=gemini-2.5-flash,LITE_MODEL=gemini-2.5-flash-lite,VERTEX_VISION_LOCATION=us-central1,QDRANT_URL=http://10.0.0.5:6333,RETRIEVAL_COLLECTION=iris_chunks_v2,CHUNK_TARGET_TOKENS=256,BM25_HINDI_ENABLED=1"
      - name: Deploy retrieval-api
        run: |
          gcloud run deploy retrieval-api \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris/retrieval-api:latest \
            --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} \
            --allow-unauthenticated --ingress=all --cpu=2 --memory=2Gi --max-instances=10 --min-instances=1 \
            --service-account=retrieval-api-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector=iris-connector --vpc-egress=private-ranges-only \
            --set-env-vars="MODEL_BACKEND=vertex,GCP_PROJECT=${{ vars.GCP_PROJECT_ID }},FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},EMBEDDING_MODEL=text-embedding-004,SYNTHESIS_MODEL=gemini-2.5-flash,LITE_MODEL=gemini-2.5-flash-lite,RETRIEVAL_COLLECTION=iris_chunks_v2,QDRANT_URL=http://10.0.0.5:6333,CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS || 'https://iris-frontend-steel-nine.vercel.app' }},INGEST_URL=${{ vars.INGEST_URL || 'https://ingestion-worker-zzdrfa3kqa-el.a.run.app' }},INGEST_SA=${{ vars.INGEST_SA || 'ingestion-worker-sa@naturepivot-rag.iam.gserviceaccount.com' }},RERANK_LOCATION=global,BM25_HINDI_ENABLED=1"
