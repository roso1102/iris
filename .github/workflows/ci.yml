name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Required for google-github-actions/auth to exchange GitHub's OIDC token
# through Workload Identity Federation. No long-lived GCP key is used.
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Ordinary unit tests use in-process mocks. The dedicated
      # reliability-linux job explicitly exercises fork isolation.
      IRIS_PROCESS_ISOLATION: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r services/ingestion-worker/requirements.txt
          pip install -r services/retrieval_api/requirements.txt

      - name: Run hermetic unit tests
        env:
          MODEL_BACKEND: mock
          QDRANT_URL: ""
          RUN_VERTEX_LIVE_TESTS: "0"
          RUN_QDRANT_LIVE_TESTS: "0"
        run: |
          python -m pytest tests/ -q -rs -m "not integration and not live"

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-rules-test/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install rules-test deps
        working-directory: firestore-rules-test
        run: npm install --include=dev --force

      - name: Run Firestore rules tests (emulator)
        working-directory: firestore-rules-test
        run: npx firebase emulators:exec --only firestore "npm test"

  build:
    runs-on: ubuntu-latest
    # Never deploy if the Linux fork gate or container reproducibility checks
    # failed. A green unit job alone is not a release gate.
    needs: [test, firestore-rules, reliability-linux, containers]
    # Deployment is an explicit manual action until the staging plan has been
    # reviewed. Pull requests and normal pushes only run tests/build checks.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Build + push images
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build ingestion-worker
        run: |
          BUILD_ID="$(gcloud builds submit --async --format='value(id)' \
            --config=services/ingestion-worker/cloudbuild.yaml \
            --gcs-source-staging-dir=gs://${{ vars.GCS_BUILD_BUCKET }}/source \
            --substitutions=_REPO=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris .)"
          test -n "$BUILD_ID"
          for attempt in $(seq 1 360); do
            STATUS="$(gcloud builds describe "$BUILD_ID" --format='value(status)')"
            echo "ingestion-worker build $BUILD_ID: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED) exit 1 ;;
            esac
            sleep 10
          done
          test "$STATUS" = SUCCESS
      - name: Build retrieval-api
        run: |
          BUILD_ID="$(gcloud builds submit --async --format='value(id)' \
            --config=services/retrieval_api/cloudbuild.yaml \
            --gcs-source-staging-dir=gs://${{ vars.GCS_BUILD_BUCKET }}/source \
            --substitutions=_REPO=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris .)"
          test -n "$BUILD_ID"
          for attempt in $(seq 1 360); do
            STATUS="$(gcloud builds describe "$BUILD_ID" --format='value(status)')"
            echo "retrieval-api build $BUILD_ID: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED) exit 1 ;;
            esac
            sleep 10
          done
          test "$STATUS" = SUCCESS

      - name: Resolve private service addresses
        run: |
          QDRANT_IP="$(gcloud compute instances describe qdrant-1 \
            --zone="${{ vars.GCP_REGION }}-b" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(networkInterfaces[0].networkIP)')"
          test -n "$QDRANT_IP"
          echo "QDRANT_IP=$QDRANT_IP" >> "$GITHUB_ENV"

      - name: Deploy ingestion-worker
        run: |
          gcloud run deploy ingestion-worker \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris/ingestion-worker:latest \
            --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} \
            --no-allow-unauthenticated --ingress=all --cpu=2 --memory=8Gi --max-instances=2 --min-instances=0 --concurrency=1 --timeout=900 \
            --service-account=ingestion-worker-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --network=iris-vpc --subnet=iris-subnet --vpc-egress=private-ranges-only \
            --set-env-vars="MODEL_BACKEND=vertex,GCP_PROJECT=${{ vars.GCP_PROJECT_ID }},FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCS_RAW_BUCKET=${{ vars.GCS_RAW_BUCKET || 'procambrian-iris-staging-raw' }},EMBEDDING_MODEL=text-embedding-004,SYNTHESIS_MODEL=gemini-2.5-flash,LITE_MODEL=gemini-2.5-flash-lite,VERTEX_VISION_LOCATION=us-central1,QDRANT_URL=http://${QDRANT_IP}:6333,RETRIEVAL_COLLECTION=iris_chunks_v2,CHUNK_TARGET_TOKENS=256,BM25_HINDI_ENABLED=1,IRIS_USE_GOOGLE_GENAI=1,SYNTHESIS_MAX_CONTEXT_BYTES=60000,SYNTHESIS_MAX_OUTPUT_TOKENS=1536,SYNTHESIS_TOP_K_DEFAULT=6"

          INGEST_URL="$(gcloud run services describe ingestion-worker \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')"
          test -n "$INGEST_URL"
          # Pub/Sub page events must hit POST /, not /ingest (fan-out), or
          # pages get re-split and republished in a loop.
          gcloud pubsub subscriptions update iris-ingestion-sub \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --push-endpoint="${INGEST_URL}/" \
            --push-auth-service-account="ingest-trigger-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --push-auth-token-audience="${INGEST_URL}"
          # Runtime IAM required by the authenticated upload path. The service
          # invoker binding is applied here because Cloud Run services are
          # deployed by CLI; the service-account token-creator binding is
          # managed by Terraform and is intentionally not changed here. The
          # worker's topic publisher binding is also Terraform-managed.
          gcloud run services add-iam-policy-binding ingestion-worker \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --member="serviceAccount:retrieval-api-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"
          # _trigger_ingestion mints the ID token as ingestion-worker-sa;
          # grant that exact token principal access to the private worker.
          gcloud run services add-iam-policy-binding ingestion-worker \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --member="serviceAccount:ingestion-worker-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"
          echo "INGEST_URL=$INGEST_URL" >> "$GITHUB_ENV"
      - name: Deploy retrieval-api
        run: |
          gcloud run deploy retrieval-api \
            --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/iris/retrieval-api:latest \
            --region=${{ vars.GCP_REGION }} --project=${{ vars.GCP_PROJECT_ID }} \
            --allow-unauthenticated --ingress=all --cpu=2 --memory=2Gi --max-instances=3 --min-instances=0 --concurrency=8 \
            --service-account=retrieval-api-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --network=iris-vpc --subnet=iris-subnet --vpc-egress=private-ranges-only \
            --set-env-vars="^|^MODEL_BACKEND=vertex|GCP_PROJECT=${{ vars.GCP_PROJECT_ID }}|FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}|GCS_RAW_BUCKET=${{ vars.GCS_RAW_BUCKET || 'procambrian-iris-staging-raw' }}|EMBEDDING_MODEL=text-embedding-004|SYNTHESIS_MODEL=gemini-2.5-flash|LITE_MODEL=gemini-2.5-flash-lite|RETRIEVAL_COLLECTION=iris_chunks_v2|QDRANT_URL=http://${QDRANT_IP}:6333|CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS || 'https://iris-frontend-steel-nine.vercel.app' }}|INGEST_URL=${INGEST_URL}|INGEST_SA=ingestion-worker-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com|RERANK_LOCATION=global|BM25_HINDI_ENABLED=1|IRIS_USE_GOOGLE_GENAI=1|SYNTHESIS_MAX_CONTEXT_BYTES=60000|SYNTHESIS_MAX_OUTPUT_TOKENS=1536|SYNTHESIS_TOP_K_DEFAULT=6"

  reliability-linux:
    # Proves the process-isolation primitive on the real platform. Windows would
    # silently skip the fork tests, so this job asserts they actually execute.
    runs-on: ubuntu-latest
    env:
      # Keep the broad suite deterministic; the explicit isolation checks
      # below pass isolate=True and are the Linux fork gate.
      IRIS_PROCESS_ISOLATION: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r services/ingestion-worker/requirements.txt
          pip install -r services/retrieval_api/requirements.txt

      - name: Fork availability and isolation primitive
        run: python scripts/ci_reliability_check.py

      - name: Process-isolation tests must execute (not skip)
        run: |
          python - <<'PY'
          import subprocess, sys
          proc = subprocess.run(
              [sys.executable, "-m", "pytest",
               "tests/test_reliability.py::TestProcessIsolation", "-q", "-rs"],
              capture_output=True, text=True,
          )
          print(proc.stdout)
          print(proc.stderr)
          if proc.returncode != 0:
              sys.exit("process-isolation tests failed")
          if "skipped" in proc.stdout.lower():
              sys.exit("process-isolation tests were skipped on Linux")
          print("process-isolation tests executed")
          PY

      - name: Full suite (with skip reasons and counts)
        run: python -m pytest tests -q -rs -m "not integration and not live"

  containers:
    # Builds the deployable Cloud Run images so the pinned SDK is proven
    # in-container. The ingestion-worker build intentionally pulls Docling
    # weights (~700 MB) — it is the image we ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build retrieval-api image
        run: docker build -f services/retrieval_api/Dockerfile -t iris-retrieval-api:ci .

      - name: Build ingestion-worker image
        run: docker build -f services/ingestion-worker/Dockerfile -t iris-ingestion-worker:ci .

      - name: Assert pinned SDK inside both images
        run: |
          docker run --rm iris-retrieval-api:ci python -c "import importlib.metadata as m; print('retrieval-api aiplatform', m.version('google-cloud-aiplatform')); assert m.version('google-genai') == '2.16.0'"
          docker run --rm iris-ingestion-worker:ci python -c "import importlib.metadata as m; print('ingestion-worker aiplatform', m.version('google-cloud-aiplatform')); assert m.version('google-genai') == '2.16.0'"
